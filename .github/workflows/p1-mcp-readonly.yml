name: MCP read-only protocol, HTTPS host entrypoint and connection probe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mcp-python:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Python syntax
        run: python -m compileall -q src tests
      - name: In-process MCP protocol tests
        run: python -m pytest -q tests/test_gateway_health.py tests/test_connection_probe.py tests/test_public_hosting.py
      - name: Local Streamable HTTP smoke
        shell: pwsh
        run: |
          $p = Start-Process -FilePath python -ArgumentList "-m", "src.gateway.server" -PassThru -NoNewWindow
          try {
            $passed = $false
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              python tests/smoke_http.py
              if ($LASTEXITCODE -eq 0) {
                python tests/probe_mcp_endpoint.py --url http://127.0.0.1:8000/mcp
              }
              if ($LASTEXITCODE -eq 0) {
                $passed = $true
                break
              }
            }
            if (-not $passed) { throw "Streamable HTTP smoke failed or never became ready" }
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Hosted ASGI entrypoint and strict Host/Origin smoke
        shell: pwsh
        run: |
          $env:MCP_PUBLIC_HOSTNAME = "localhost"
          $env:PORT = "18080"
          $p = Start-Process -FilePath python -ArgumentList "-m", "src.gateway.public_server" -PassThru -NoNewWindow
          try {
            $passed = $false
            for ($i = 0; $i -lt 15; $i++) {
              Start-Sleep -Seconds 2
              python tests/probe_mcp_endpoint.py --url http://localhost:18080/mcp
              if ($LASTEXITCODE -eq 0) {
                $passed = $true
                break
              }
            }
            if (-not $passed) { throw "Hosted ASGI endpoint never passed its positive MCP probe" }
            python tests/smoke_public_host.py
            if ($LASTEXITCODE -ne 0) { throw "Host/Origin negative security smoke failed" }
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
