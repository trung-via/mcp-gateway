name: MCP Gateway P2 HostOps source and offline contract tests

on:
  pull_request:
    paths:
      - 'scripts/hostops/**'
      - 'tests/hostops/**'
      - 'templates/private-hostops/**'
      - '.github/workflows/p2-hostops-*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/hostops/**'
      - 'tests/hostops/**'
      - 'templates/private-hostops/**'
      - '.github/workflows/p2-hostops-*.yml'

permissions:
  contents: read

jobs:
  offline-hostops-contract:
    runs-on: windows-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Parse HostOps script and run deterministic mocked controls
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/hostops/test-p2-provider-controls.ps1
          if ($LASTEXITCODE -ne 0) { throw 'OFFLINE_HOSTOPS_CONTRACT_FAILED' }
      - name: Check inert private HostOps template and immutable source pin
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/hostops/test-private-hostops-template.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_HOSTOPS_TEMPLATE_POLICY_FAILED' }
      - name: Deny direct public-repository HostOps native triggers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflows = @(Get-ChildItem -Path '.github/workflows' -File -Filter '*.yml')
          foreach ($path in $workflows) {
            $workflow = Get-Content -LiteralPath $path.FullName -Raw
            if ($workflow -match '(?im)^\s*runs-on:\s*(?:\[?\s*self-hosted\b)' -or
                $workflow -match '(?im)^\s*issue_comment:\s*$') {
              throw 'PUBLIC_REPO_HOSTOPS_NATIVE_TRIGGER_FORBIDDEN'
            }
          }
          'P2_HOSTOPS_PUBLIC_REPO_RUNNER_DENY=PASS'
