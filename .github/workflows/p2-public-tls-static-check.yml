name: P2 public TLS-ALPN-01 static proof parser and safety

on:
  pull_request:
    paths:
      - 'scripts/p2-public-tls443-static-probe.ps1'
      - 'scripts/p2-tls443-cleanup-watchdog.ps1'
      - '.github/workflows/p2-public-tls-static-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps7-static-only:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell AST syntax parse (no execution)
        shell: pwsh
        run: |
          foreach ($file in @('scripts/p2-public-tls443-static-probe.ps1', 'scripts/p2-tls443-cleanup-watchdog.ps1')) {
            $tokens = $null; $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path, [ref]$tokens, [ref]$errors
            )
            if (@($errors).Count) { $errors | ForEach-Object { Write-Error $_.Message }; throw "AST_PARSE_FAIL: $file" }
            Write-Output "AST_PARSE_PASS: $file"
          }
      - name: Check explicit opt-in, static-only ACME port 443 and rollback
        shell: pwsh
        run: |
          $code = Get-Content -Raw 'scripts/p2-public-tls443-static-probe.ps1'
          $watch = Get-Content -Raw 'scripts/p2-tls443-cleanup-watchdog.ps1'
          $must = @(
            '#Requires -RunAsAdministrator',
            '[switch] $ApprovePublicACME',
            'if (-not $CheckBindOnly -and -not $ApprovePublicACME)',
            'issuer acme',
            'disable_http_challenge',
            'bind $ipv6',
            'skip_install_trust',
            'admin off',
            'New-NetFirewallRule -PolicyStore ActiveStore',
            '-Profile Private',
            '-Program $caddyPath',
            '-LocalAddress $ipv6',
            '-LocalPort 443',
            '[switch] $CheckBindOnly',
            'CADDY_HTTP_IPV6_LISTENER=PASS',
            'CADDY_ACME_BIND_HOST_RAW_IPV6=PASS',
            "PSObject.Properties['bind_host']",
            'CADDY_BIND_IPV6_HOST_ONLY=PASS',
            'PUBLIC_ACME_CA_CONTACT=NO',
            'NO_FIREWALL_CHANGE=YES',
            'PUBLIC_TLS_TRUST=PASS_VALIDATED_WITHOUT_INSECURE',
            'Remove-NetFirewallRule -PolicyStore ActiveStore',
            'Stop-Process -Id $process.Id',
            'finally'
          )
          foreach ($marker in $must) {
            if (-not $code.Contains($marker)) { throw "MISSING_REQUIRED_BOUNDARY: $marker" }
          }
          if ($code -match '(?m)^\s*(tls internal|reverse_proxy|exec|import|handle_path)\b') {
            throw 'FORBIDDEN_STATIC_ONLY_DIRECTIVE'
          }
          # Regression: tls-alpn's embedded listener cannot use network/host as a bind host.
          if ($code -match '(?m)^\s*bind\s+(tcp6/|tcp4/|tcp/|0\.0\.0\.0|\[|::)') {
            throw 'ACME_TLS_ALPN_BIND_HOST_PREFIX_REGRESSION'
          }
          if ($code -notmatch '(?m)^\s*bind\s+\$ipv6\s*
              $code.IndexOf('if ($CheckBindOnly)') -ge $code.IndexOf('$process = Start-Process')) {
            throw 'READONLY_PREFLIGHT_MUST_EXIT_BEFORE_STARTING_CADDY'
          }
          if (-not $watch.Contains('ExpectedConfigPath') -or -not $watch.Contains('Remove-NetFirewallRule')) {
            throw 'WATCHDOG_CLEANUP_MISSING'
          }
          Write-Output 'P2_PUBLIC_TLS_STATIC_SECURITY_MARKERS_PASS'
) {
            throw 'RAW_IPV6_HOST_REQUIRED_FOR_ACME_BIND'
          }
          if ($code.IndexOf('CADDY_ACME_BIND_HOST_RAW_IPV6=PASS') -ge $code.IndexOf('if ($CheckBindOnly)') -or
              $code.IndexOf("PSObject.Properties['bind_host']") -lt 0) {
            throw 'ACME_BIND_HOST_MUST_BE_CHECKED_BEFORE_READONLY_PASS'
          }
          if ($code.IndexOf('if ($CheckBindOnly)') -lt 0 -or
              $code.IndexOf('if ($CheckBindOnly)') -ge $code.IndexOf('$process = Start-Process')) {
            throw 'READONLY_PREFLIGHT_MUST_EXIT_BEFORE_STARTING_CADDY'
          }
          if (-not $watch.Contains('ExpectedConfigPath') -or -not $watch.Contains('Remove-NetFirewallRule')) {
            throw 'WATCHDOG_CLEANUP_MISSING'
          }
          Write-Output 'P2_PUBLIC_TLS_STATIC_SECURITY_MARKERS_PASS'
