name: P2 IPv6 ingress temporary probe PowerShell checks

on:
  pull_request:
    paths:
      - "scripts/p2-ipv6-443-*.ps1"
      - ".github/workflows/p2-ipv6-443-script-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-parse-and-static-safety:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Parse scripts without executing or opening ports
        shell: pwsh
        run: |
          $files = @(
            'scripts/p2-ipv6-443-temporary-probe.ps1',
            'scripts/p2-ipv6-443-cleanup-watchdog.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            $resolved = (Resolve-Path $file).Path
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $resolved, [ref]$tokens, [ref]$errors
            )
            if (@($errors).Count -ne 0) {
              $errors | ForEach-Object { Write-Error "$file - $($_.Message)" }
              throw "POWERSHELL_PARSE_FAIL: $file"
            }
            Write-Output "POWERSHELL_PARSE_PASS: $file"
          }

      - name: Verify test-only static response and scoped firewall contract
        shell: pwsh
        run: |
          $main = Get-Content -Raw scripts/p2-ipv6-443-temporary-probe.ps1
          $guard = Get-Content -Raw scripts/p2-ipv6-443-cleanup-watchdog.ps1
          $mandatory = @(
            '#Requires -RunAsAdministrator',
            '-PolicyStore ActiveStore',
            '-Profile Private',
            '-LocalAddress $ipv6',
            '-Program $caddyPath',
            '-LocalPort 443',
            'tls internal',
            'skip_install_trust',
            'admin off',
            'respond $probePath',
            "MCP_BACKEND_EXPOSED=NO",
            "New-NetFirewallRule",
            "Remove-NetFirewallRule",
            "[switch] $UseTcpDataIPv6Probe",
            "[switch] $UseMultiSourceIPv6Probe",
            "[switch] $ApproveTemporaryIngress",
            "[switch] $ApproveRemoteProbeDisclosure",
            "[ValidateRange(60,180)]",
            "REMOTE_TCPDATA_IPV6_CONTROL=PASS",
            "REMOTE_CHECKHOST_IPV6_DISTINCT_ASN_CONTROL=PASS",
            "REMOTE_CHECKHOST_IPV6_SUCCESS_COUNT=",
            "Test-CheckHostIPv6Hit",
            "ipv6.google.com:443",
            "check-host.net/check-tcp",
            "MAX_FIREWALL_WINDOW_SECONDS=",
            "'-DelaySeconds', [string]$DurationSeconds",
            "LOCAL_IPV6_HTTPS_STATIC=PASS",
            "REMOTE_IPV6_TCPDATA_STATUS=",
            "ipv6.google.com",
            "finally"
          )
          foreach ($marker in $mandatory) {
            if (-not $main.Contains($marker)) {
              throw "SAFETY_MARKER_MISSING: $marker"
            }
          }
          if ($main -match '(?m)^\s*reverse_proxy\b|Start-Process.*CDP|Set-NetFirewallProfile|netsh.*firewall') {
            throw "UNEXPECTED_UNBOUNDED_OR_PROXY_EFFECT"
          }
          if ($main.IndexOf("ipv6.google.com") -ge $main.IndexOf('New-NetFirewallRule')) {
            throw "IPV6_REMOTE_CONTROL_MUST_BE_PREFLIGHT_BEFORE_FIREWALL"
          }
          if (-not $main.Contains('if ($UseTcpDataIPv6Probe)')) {
            throw "REMOTE_CHECK_MUST_REQUIRE_EXPLICIT_OPT_IN"
          }
          if (-not $main.Contains('if (-not $ApproveTemporaryIngress)') -or
              -not $main.Contains('if ($UseMultiSourceIPv6Probe -and -not $ApproveRemoteProbeDisclosure)')) {
            throw 'MISSING_EXPLICIT_HOST_AND_REMOTE_DISCLOSURE_GRANTS'
          }
          if ($main -match '(?m)^s*[ValidateRange(60,(?!180))' -or
              $main.Contains('($DurationSeconds + 30)') -or
              -not $main.Contains('AddSeconds($DurationSeconds - 15)')) {
            throw 'TEMP_FIREWALL_HARD_CEILING_180_REQUIRED'
          }
          if ($main -match '(?mi)^s*(issuers+acme|acme_ca|disable_http_challenge|reverse_proxy|tlss+internals+.*S)') {
            throw 'NON_CA_STATIC_ONLY_CONFIG_REQUIRED'
          }
          if (-not $main.Contains('REMOTE_PROBE_SCOPE=TCP_ONLY; external TLS-SNI/ALPN not established')) {
            throw 'TCP_EVIDENCE_MUST_NOT_CLAIM_TLS_OR_ACME'
          }
          if ($main.IndexOf('REMOTE_CHECKHOST_IPV6_DISTINCT_ASN_CONTROL=PASS') -ge
              $main.IndexOf('New-NetFirewallRule -PolicyStore ActiveStore')) {
            throw 'MULTISOURCE_CONTROLS_MUST_PRECEDE_FIREWALL'
          }
          if (-not $guard.Contains('Remove-NetFirewallRule') -or
              -not $guard.Contains('ExpectedConfigPath')) {
            throw "WATCHDOG_CONTRACT_MISSING"
          }
          Write-Output "STATIC_SAFETY_MARKERS_PASS"
